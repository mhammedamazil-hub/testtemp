<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Forge — source-grounded research notebook</title>
<meta name="description" content="Forge is a research notebook: import sources, ask grounded questions, and get answers with citations that open the exact evidence." />
<meta name="theme-color" content="#0e1116" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/" aria-label="Forge home">
      <span class="mark" aria-hidden="true">F</span>
      <span class="name">Forge</span>
    </a>
    <span class="spacer"></span>
    <span class="badge" id="engineBadge" title="Answering engine">engine: …</span>
    <a class="badge" id="capsLink" href="#/capabilities" title="What this build supports">capabilities</a>
    <button class="ghost" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button>
  </header>
  <main id="app" tabindex="-1">
    <div class="library"><p class="empty">Loading…</p></div>
  </main>
</div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Forge needs JavaScript for its interactive workspace.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
