[project]
name = "idol-studio-api"
version = "1.0.0"
description = "Backend for Idol Image-to-3D Studio: ComfyUI worker orchestration, job queue, storage and history."
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "websockets>=12,<16",
    "python-multipart>=0.0.9,<1",
    "pillow>=3.0,<12",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.comfy", "app.routes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
