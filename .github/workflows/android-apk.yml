name: Android APK

on:
  workflow_dispatch:
    inputs:
      editor_artifacts_from_run:
        description: "Optional successful/partially successful source-build run ID to reuse its editor-web-* artifacts"
        required: false
        type: string
  push:
    branches: ["arena/**"]
    paths:
      - ".gitmodules"
      - "upstream/**"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  actions: read
  contents: read

env:
  RUST_TOOLCHAIN: "1.95.0"
  TRUNK_VERSION: "0.21.14"

jobs:
  editor-web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.editor_artifacts_from_run == '' }}
    name: Build ${{ matrix.editor }} from upstream
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: photocraft
            build: trunk
          - editor: vectorcraft
            build: trunk
          - editor: filmcraft
            build: xtask
          - editor: lightcraft
            build: xtask
          - editor: pdfcraft
            build: trunk
          - editor: effectcraft
            build: xtask
          - editor: designcraft
            build: trunk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch only the editor under test
        run: git submodule update --init --depth 1 upstream/${{ matrix.editor }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/${{ matrix.editor }} -> upstream/${{ matrix.editor }}/target
      - name: Install web build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binaryen
          if [[ "${{ matrix.build }}" == "trunk" ]]; then
            cargo install trunk --version "$TRUNK_VERSION" --locked
          else
            cargo install wasm-bindgen-cli --version 0.2.129 --locked
          fi
      - name: Build upstream WebAssembly editor
        working-directory: upstream/${{ matrix.editor }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.editor }}" in
            photocraft) cd apps/photocraft-web && trunk build --release; output=../../dist/web ;;
            vectorcraft) cd apps/vectorcraft-web && trunk build --release; output=../../dist/web ;;
            filmcraft) cargo xtask web; output=target/web/dist ;;
            lightcraft) cargo xtask web; output=target/web-site ;;
            pdfcraft) cd apps/pdfcraft-web && trunk build --release; output=../../dist/web ;;
            effectcraft) cargo xtask web; output=target/web/dist ;;
            designcraft) cd apps/designcraft-web && trunk build --release; output=../../dist/web ;;
            *) echo "Unknown editor: ${{ matrix.editor }}" >&2; exit 2 ;;
          esac
          test -s "$output/index.html"
          find "$output" -type f -size +0c -print | sed -n '1,20p'
          root="$GITHUB_WORKSPACE/upstream/${{ matrix.editor }}"
          bundle="$GITHUB_WORKSPACE/editor-artifacts/${{ matrix.editor }}"
          mkdir -p "$bundle" "$bundle/licenses"
          cp -a "$output/." "$bundle/"
          cp "$root/LICENSE-MIT" "$root/LICENSE-APACHE" "$bundle/licenses/"
          for notice in ATTRIBUTION.md ASSETS.md ATTRIBUTION.toml LICENSES.toml; do
            if [[ -f "$root/$notice" ]]; then cp "$root/$notice" "$bundle/licenses/"; fi
          done
          if [[ -d "$root/licenses" ]]; then mkdir -p "$bundle/licenses/third-party"; cp -a "$root/licenses/." "$bundle/licenses/third-party/"; fi
          if [[ -f "$root/assets/ATTRIBUTION.md" ]]; then cp "$root/assets/ATTRIBUTION.md" "$bundle/licenses/"; fi
      - name: Upload built editor bundle
        uses: actions/upload-artifact@v7
        with:
          name: editor-web-${{ matrix.editor }}
          path: editor-artifacts/${{ matrix.editor }}/
          if-no-files-found: error
          retention-days: 7

  apk:
    name: Package single installable APK
    needs: editor-web
    if: ${{ always() && (needs.editor-web.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.editor_artifacts_from_run != '')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Download editor bundles from this run
        if: ${{ inputs.editor_artifacts_from_run == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: editor-web-*
          path: editor-artifacts
          merge-multiple: false
      - name: Reuse editor bundles from an earlier run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.editor_artifacts_from_run != '' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.editor_artifacts_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: editor-web-*
          path: editor-artifacts
          merge-multiple: false
      - name: Assemble real upstream editor assets
        shell: bash
        run: |
          set -euo pipefail
          for editor in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft; do
            source="editor-artifacts/editor-web-${editor}"
            test -s "$source/index.html"
            mkdir -p "app/src/main/assets/editors/${editor}" "app/src/main/assets/licenses/${editor}"
            cp -a "$source/." "app/src/main/assets/editors/${editor}/"
            if [[ -d "$source/licenses" ]]; then
              cp -a "$source/licenses/." "app/src/main/assets/licenses/${editor}/"
              rm -rf "app/src/main/assets/editors/${editor}/licenses"
            fi
          done
          # Android's asset merger treats a .gz sidecar and its plain file as duplicate entries.
          # The WebView serves the uncompressed upstream asset directly, so drop only redundant sidecars.
          while IFS= read -r -d '' compressed; do
            original="${compressed%.gz}"
            if [[ -f "$original" ]]; then
              echo "Dropping redundant gzip sidecar: $compressed"
              rm -- "$compressed"
            fi
          done < <(find app/src/main/assets/editors -type f -name '*.gz' -print0)
          test -s app/src/main/assets/studio/index.html
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log
      - name: Publish Gradle failure details
        if: failure()
        shell: bash
        run: |
          if [[ -f gradle-build.log ]]; then
            details=$(grep -E '(^e: |^FAILURE:|What went wrong|Execution failed for task|^Could not |^A problem occurred|^error:|^Caused by:|^.*Exception:)' gradle-build.log | tail -n 40 || true)
            if [[ -z "$details" ]]; then details=$(tail -n 30 gradle-build.log); fi
            printf '%s' "$details" | tr '\n' ' ' | head -c 12000 | sed 's/%/%25/g; s/\r/%0D/g' > /tmp/gradle-tail.txt
            echo "::error title=Gradle build failed::$(cat /tmp/gradle-tail.txt)"
            echo '### Gradle failure log' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK and editor payloads
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/studio/index.html'
          for editor in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft; do
            unzip -l "$apk" | grep -q "assets/editors/${editor}/index.html"
            unzip -l "$apk" | grep -q "assets/licenses/${editor}/LICENSE-MIT"
            unzip -l "$apk" | grep -q "assets/licenses/${editor}/LICENSE-APACHE"
          done
          sha256sum "$apk"
      - uses: actions/upload-artifact@v7
        with:
          name: artcraft-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
