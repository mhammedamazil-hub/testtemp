name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".gitmodules"
      - "upstream/**"
      - "native-android/**"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  GRADLE_VERSION: "8.11.1"

jobs:
  native-apk:
    name: Compile upstream Rust editors for Android and package APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out pinned editor sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-android -> native-android/target

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Compile native Rust app and all seven upstream egui editors
        working-directory: native-android
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo ndk --link-cxx-shared -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release >native-build.log 2>&1; then
            tail -n 45 native-build.log
            summary=$(tail -n 35 native-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g')
            echo "::error title=Native Rust build failed::$summary"
            exit 1
          fi
          test -s ../app/src/main/jniLibs/arm64-v8a/libartcraft_android.so
          test -s ../app/src/main/jniLibs/x86_64/libartcraft_android.so
          file ../app/src/main/jniLibs/arm64-v8a/libartcraft_android.so ../app/src/main/jniLibs/x86_64/libartcraft_android.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"

      - name: Package installable debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify this is a native Rust APK, not a web bundle
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          listing=$(unzip -l "$apk")
          grep -q 'lib/arm64-v8a/libartcraft_android.so' <<< "$listing"
          grep -q 'lib/x86_64/libartcraft_android.so' <<< "$listing"
          manifest_xml=$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml)
          grep -q 'android.app.NativeActivity' <<< "$manifest_xml"
          if grep -Eq 'assets/editors/|assets/studio/index\.html|assets/.*\.wasm' <<< "$listing"; then
            echo "Unexpected browser/WASM payload found in native APK." >&2
            exit 1
          fi
          sha256sum "$apk"

      - name: Upload native debug APK before emulator smoke test
        uses: actions/upload-artifact@v7
        with:
          name: artcraft-studio-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 0666 /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator startup may be slower."
          fi

      - name: Run native Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n ai.artcraft.studio/android.app.NativeActivity
            for attempt in $(seq 1 40); do
              if adb logcat -d -s ARTCRAFT:V | grep -Fq ARTCRAFT_NATIVE_FIRST_FRAME; then
                echo "Native Rust UI rendered its first Android frame."
                exit 0
              fi
              sleep 2
            done
            adb logcat -d -s ARTCRAFT:V || true
            echo "Native Rust Android app did not render its first frame within 80 seconds." >&2
            exit 1

      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-build-log
          path: |
            gradle-build.log
            native-android/native-build.log
          if-no-files-found: ignore
          retention-days: 7
