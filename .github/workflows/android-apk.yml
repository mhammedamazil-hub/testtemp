name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".gitmodules"
      - "upstream/**"
      - "native-android/**"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  GRADLE_VERSION: "8.11.1"

jobs:
  editor-native:
    name: Build ${{ matrix.editor }} native Rust library
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        editor: [photocraft, vectorcraft, filmcraft, lightcraft, pdfcraft, effectcraft, designcraft]
    steps:
      - name: Check out editor source
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize this pinned upstream editor
        run: git submodule update --init --depth 1 upstream/${{ matrix.editor }}

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-android/editors/${{ matrix.editor }} -> native-android/editors/${{ matrix.editor }}/target

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Compile editor NativeActivity library for ARM64 and x86_64
        working-directory: native-android/editors/${{ matrix.editor }}
        shell: bash
        run: |
          set -euo pipefail
          library="libartcraft_${{ matrix.editor }}.so"
          if ! cargo ndk --link-libcxx-shared -t arm64-v8a -t x86_64 -o ../../../app/src/main/jniLibs build --release >native-build.log 2>&1; then
            tail -n 45 native-build.log
            summary=$(grep -F -e 'error[' -e 'error: could not compile' native-build.log | tail -n 20 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g')
            echo "::error title=${{ matrix.editor }} Rust build failed::$summary"
            exit 1
          fi
          test -s "../../../app/src/main/jniLibs/arm64-v8a/$library"
          test -s "../../../app/src/main/jniLibs/x86_64/$library"
          file "../../../app/src/main/jniLibs/arm64-v8a/$library" "../../../app/src/main/jniLibs/x86_64/$library"

      - name: Upload native libraries for the single APK
        uses: actions/upload-artifact@v7
        with:
          name: artcraft-native-libs-${{ matrix.editor }}
          path: app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-log-${{ matrix.editor }}
          path: native-android/editors/${{ matrix.editor }}/native-build.log
          if-no-files-found: ignore
          retention-days: 7

  package-apk:
    name: Package one seven-editor APK and run emulator smoke tests
    needs: editor-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Android app
        uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download all seven native editor libraries
        uses: actions/download-artifact@v8
        with:
          pattern: artcraft-native-libs-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Verify all fourteen native libraries are present
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            for editor in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft; do
              test -s "app/src/main/jniLibs/${abi}/libartcraft_${editor}.so"
            done
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"

      - name: Package single installable debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify native APK has every editor and no web payload
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          listing=$(unzip -l "$apk")
          for abi in arm64-v8a x86_64; do
            for editor in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft; do
              grep -q "lib/${abi}/libartcraft_${editor}.so" <<< "$listing"
            done
          done
          manifest_xml=$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml)
          grep -q 'ai.artcraft.studio.MainActivity' <<< "$manifest_xml"
          for editor in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft; do
            grep -q "artcraft_${editor}" <<< "$manifest_xml"
          done
          if grep -Eq 'assets/editors/|assets/studio/index[.]html|assets/.*[.]wasm' <<< "$listing"; then
            echo "Unexpected browser/WASM editor payload found in native APK." >&2
            exit 1
          fi
          sha256sum "$apk"

      - name: Upload installable debug APK before runtime tests
        uses: actions/upload-artifact@v7
        with:
          name: artcraft-studio-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 0666 /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator startup may be slower."
          fi

      - name: Install and launch each authentic native editor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            package=ai.artcraft.studio
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n "$package/.MainActivity"
            for item in "PhotoCraft photocraft" "VectorCraft vectorcraft" "FilmCraft filmcraft" "LightCraft lightcraft" "PdfCraft pdfcraft" "EffectCraft effectcraft" "DesignCraft designcraft"; do
              read -r title editor <<< "$item"
              activity="${title}Activity"
              adb shell am force-stop "$package"
              adb logcat -c
              adb shell am start -W -n "$package/.$activity"
              found=false
              for attempt in $(seq 1 40); do
                if adb logcat -d -s ARTCRAFT:V | grep -Fq "ARTCRAFT_NATIVE_FIRST_FRAME:$title"; then
                  echo "$title rendered its first native Rust UI frame."
                  found=true
                  break
                fi
                sleep 2
              done
              if [[ "$found" != true ]]; then
                adb logcat -d -s ARTCRAFT:V || true
                echo "$title did not render its native first frame." >&2
                exit 1
              fi
            done

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-apk-gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
