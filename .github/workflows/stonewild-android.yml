name: Stonewild Realms Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "stonewild/luanti/**"
      - ".github/workflows/stonewild-android.yml"
  pull_request:
    paths:
      - "stonewild/luanti/**"
      - ".github/workflows/stonewild-android.yml"

permissions:
  contents: read

concurrency:
  group: stonewild-luanti-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Luanti 5.17 arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out Stonewild overlay
        uses: actions/checkout@v7

      - name: Install asset and translation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android NDK and SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Cache Gradle and Luanti Android dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: stonewild-luanti-5.17-android-${{ runner.os }}-${{ hashFiles('stonewild/luanti/scripts/prepare_upstream.sh') }}

      - name: Preserve debug signing identity
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: stonewild-realms-debug-keystore-v1

      - name: Verify original Lua syntax
        run: |
          sudo apt-get install --no-install-recommends -y lua5.1
          find stonewild/luanti/games/stonewild -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p
          lua5.1 stonewild/luanti/tests/load_game.lua \
            stonewild/luanti/games/stonewild

      - name: Build pinned standalone APK
        run: stonewild/luanti/scripts/build_android.sh /tmp/stonewild-android-output

      - name: Verify signature, identity, ABI, and embedded game
        run: |
          set -euo pipefail
          APK=/tmp/stonewild-android-output/stonewild-realms-arm64-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='org.stonewild.realms'" /tmp/badging.txt
          grep -q "application-label:'Stonewild Realms'" /tmp/badging.txt
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/libluanti.so' /tmp/apk-files.txt
          ! grep -qE 'lib/(x86|x86_64|armeabi-v7a)/' /tmp/apk-files.txt
          unzip -p "$APK" assets/assets.zip > /tmp/stonewild-assets.zip
          unzip -t /tmp/stonewild-assets.zip
          unzip -l /tmp/stonewild-assets.zip | tee /tmp/assets-files.txt
          grep -q 'games/stonewild/game.conf' /tmp/assets-files.txt
          grep -q 'games/stonewild/mods/sw_world/init.lua' /tmp/assets-files.txt
          grep -q 'games/stonewild/mods/sw_survival/init.lua' /tmp/assets-files.txt
          grep -q 'games/stonewild/menu/background.png' /tmp/assets-files.txt
          grep -q 'STONEWILD_ENGINE_NOTICE.md' /tmp/assets-files.txt
          ! grep -q 'games/devtest/' /tmp/assets-files.txt
          unzip -p /tmp/stonewild-assets.zip games/stonewild/game.conf | grep -q 'title = Stonewild Realms'

      - name: Upload Stonewild Realms APK
        uses: actions/upload-artifact@v7
        with:
          name: stonewild-realms-arm64-debug-${{ github.run_number }}
          path: /tmp/stonewild-android-output/stonewild-realms-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
