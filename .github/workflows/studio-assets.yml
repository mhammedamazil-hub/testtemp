name: Studio CPU Blender assets
on:
  workflow_dispatch:
  push:
    branches: [arena/5ee9eac5-testtemp]
    paths: [studio/blender_scene.py, .github/workflows/studio-assets.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: sudo apt-get update && sudo apt-get install -y blender
      - name: Render genuine geometry on CPU
        run: |
          set -euo pipefail
          mkdir -p assets/studio3d
          for recipe in product architecture membrane; do
            printf '{"recipe":"%s","resolution":1200,"samples":96,"device":"CPU","angles":[30,65]}' "$recipe" > "assets/studio3d/$recipe.json"
            blender -b --python-exit-code 1 --python studio/blender_scene.py -- "assets/studio3d/$recipe.json" "assets/studio3d/$recipe"
            python3 -c "import json,hashlib; from pathlib import Path; p=Path('assets/studio3d/$recipe.json'); m=json.loads(Path('assets/studio3d/$recipe/manifest.json').read_text()); assert m['spec_sha256']==hashlib.sha256(p.read_bytes()).hexdigest(); assert m['script_sha256']==hashlib.sha256(Path('studio/blender_scene.py').read_bytes()).hexdigest()"
          done
      - name: Preserve sources and renders on the current branch
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'Studio asset pipeline'
          git config user.email 'studio-pipeline@users.noreply.github.com'
          git add assets/studio3d
          git diff --cached --quiet && exit 0
          git commit -m 'Generate genuine CPU Blender presentation assets'
          git push origin "HEAD:$CURRENT_BRANCH"
