name: Presentation quality
on:
  workflow_dispatch:
  push:
    paths: ['studio/**', 'tests/**', 'examples/**', 'assets/fonts/**', '.github/workflows/presentation-quality.yml']
  pull_request:
    paths: ['studio/**', 'tests/**', 'examples/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-studio.txt
      - name: Install verified headless DeckCraft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/tools
          gh release download v0.17.0 --repo storytold/deckcraft --pattern deckcraft-0.17.0-linux-x86_64.AppImage --pattern SHA256SUMS.txt --dir .local/tools
          cd .local/tools
          grep ' deckcraft-0.17.0-linux-x86_64.AppImage$' SHA256SUMS.txt | sha256sum --check --strict
          chmod +x deckcraft-0.17.0-linux-x86_64.AppImage
          ./deckcraft-0.17.0-linux-x86_64.AppImage --appimage-extract > /dev/null
          echo "DECKCRAFT_CLI=$PWD/squashfs-root/usr/bin/deckcraft-cli" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
  blender-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender
      - run: blender -b --python-exit-code 1 --python studio/blender_scene.py -- examples/product-scene.json output/3d
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-blender-source-and-renders
          path: output/3d/
