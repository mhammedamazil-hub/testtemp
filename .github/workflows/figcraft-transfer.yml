name: Temporary FigCraft CLI transfer
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/figcraft-transfer.yml
permissions:
  contents: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/arena/949ce470-testtemp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official release
        run: |
          set -euo pipefail
          base=https://github.com/storytold/figcraft/releases/download/v0.18.1
          curl -fL --retry 3 -o /tmp/figcraft.AppImage "$base/figcraft-0.18.1-linux-x86_64.AppImage"
          curl -fL --retry 3 -o /tmp/SHA256SUMS.txt "$base/SHA256SUMS.txt"
          cd /tmp
          grep ' figcraft-0.18.1-linux-x86_64.AppImage$' SHA256SUMS.txt | sed 's/figcraft-0.18.1-linux-x86_64.AppImage/figcraft.AppImage/' | sha256sum -c -
          chmod +x figcraft.AppImage
          ./figcraft.AppImage --appimage-extract >/dev/null
          find squashfs-root -type f -iname '*figcraft*' -printf '%p %s\n'
          test -f squashfs-root/usr/bin/figcraft-cli
          mkdir -p "$GITHUB_WORKSPACE/.figcraft-transfer"
          xz -T2 -c squashfs-root/usr/bin/figcraft-cli > "$GITHUB_WORKSPACE/.figcraft-transfer/figcraft-cli.xz"
          sha256sum squashfs-root/usr/bin/figcraft-cli | cut -d' ' -f1 > "$GITHUB_WORKSPACE/.figcraft-transfer/sha256.txt"
      - name: Transfer CLI to this branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .figcraft-transfer
          git commit -m 'Temporary transfer of FigCraft CLI'
          git push origin HEAD:refs/heads/arena/949ce470-testtemp
