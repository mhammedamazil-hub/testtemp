name: Stonewild Realms Linux Mint DEB

on:
  workflow_dispatch:
  push:
    paths:
      - "stonewild/luanti/**"
      - ".github/workflows/stonewild-linux.yml"
  pull_request:
    paths:
      - "stonewild/luanti/**"
      - ".github/workflows/stonewild-linux.yml"

permissions:
  contents: read

concurrency:
  group: stonewild-luanti-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-mint-package:
    name: Luanti 5.17 Linux Mint 21+ package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out Stonewild overlay
        uses: actions/checkout@v7

      - name: Install Luanti build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build g++ libc6-dev dpkg-dev file gettext \
            libpng-dev libjpeg-dev libgl1-mesa-dev libgl1-mesa-dri \
            libsqlite3-dev libogg-dev libvorbis-dev libopenal-dev \
            libcurl4-gnutls-dev libfreetype6-dev zlib1g-dev libgmp-dev \
            libjsoncpp-dev libzstd-dev libluajit-5.1-dev libsdl2-dev \
            desktop-file-utils xvfb xauth lua5.1

      - name: Verify original Lua syntax
        run: |
          find stonewild/luanti/games/stonewild -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p
          lua5.1 stonewild/luanti/tests/load_game.lua \
            stonewild/luanti/games/stonewild

      - name: Build, launch headless world, and package
        env:
          STONEWILD_BUILD_JOBS: "2"
        run: stonewild/luanti/scripts/build_linux_deb.sh /tmp/stonewild-linux-output

      - name: Inspect Debian package
        run: |
          set -euo pipefail
          DEB=/tmp/stonewild-linux-output/stonewild-realms_0.3.0_amd64.deb
          test -s "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee /tmp/deb-files.txt
          rm -rf /tmp/stonewild-deb-root
          dpkg-deb --extract "$DEB" /tmp/stonewild-deb-root
          ROOT=/tmp/stonewild-deb-root
          BIN="$ROOT/opt/stonewild-realms/bin/luanti"
          test -x "$BIN"
          test -f "$ROOT/opt/stonewild-realms/games/stonewild/game.conf"
          test -x "$ROOT/usr/bin/stonewild-realms"
          test -f "$ROOT/usr/share/doc/stonewild-realms/LUANTI-LGPL-2.1.txt"
          "$BIN" --version
          LUANTI_USER_PATH=/tmp/stonewild-package-user "$BIN" --gameid list \
            > /tmp/stonewild-games.txt 2>&1
          cat /tmp/stonewild-games.txt
          grep -q stonewild /tmp/stonewild-games.txt
          desktop-file-validate \
            "$ROOT/usr/share/applications/org.stonewild.realms.desktop"
          file "$BIN" | tee /tmp/stonewild-file.txt
          grep -q 'ELF 64-bit' /tmp/stonewild-file.txt
          ldd "$BIN" | tee /tmp/stonewild-ldd.txt
          ! grep -q 'not found' /tmp/stonewild-ldd.txt

      - name: Validate desktop renderer under software OpenGL
        run: |
          set -euo pipefail
          ROOT=/tmp/stonewild-deb-root/opt/stonewild-realms
          BIN="$ROOT/bin/luanti"
          USER=/tmp/stonewild-visual-user
          WORLD=/tmp/stonewild-visual-world
          rm -rf "$USER" "$WORLD"
          mkdir -p "$USER"
          set +e
          LUANTI_USER_PATH="$USER" timeout --signal=INT --kill-after=5s 10s \
            "$BIN" --server --world "$WORLD" --gameid stonewild \
            --config "$ROOT/stonewild.conf" > /tmp/stonewild-server.log 2>&1
          server_status=$?
          set -e
          cat /tmp/stonewild-server.log
          if [[ "$server_status" -ne 0 && "$server_status" -ne 124 ]]; then
            diagnostic=$(tail -n 120 /tmp/stonewild-server.log | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')
            echo "::error title=Stonewild server smoke failed (status $server_status)::$diagnostic"
            exit 1
          fi
          test -f "$WORLD/world.mt"
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=5s 20s \
            env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null LUANTI_USER_PATH="$USER" \
            "$BIN" --world "$WORLD" --gameid stonewild --config "$ROOT/stonewild.conf" --go \
            > /tmp/stonewild-visual.log 2>&1
          visual_status=$?
          set -e
          cat /tmp/stonewild-visual.log
          if [[ "$visual_status" -ne 0 && "$visual_status" -ne 124 ]]; then
            diagnostic=$(tail -n 160 /tmp/stonewild-visual.log | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')
            echo "::error title=Stonewild visual smoke failed (status $visual_status)::$diagnostic"
            exit 1
          fi
          if grep -E 'ERROR\[Main\]|ModError|LuaError|ServerError' /tmp/stonewild-visual.log; then
            diagnostic=$(tail -n 160 /tmp/stonewild-visual.log | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')
            echo "::error title=Stonewild visual smoke logged an engine error::$diagnostic"
            exit 1
          fi

      - name: Upload Linux diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stonewild-realms-linux-mint-amd64-${{ github.run_number }}
          path: |
            /tmp/stonewild-linux-output/stonewild-realms_0.3.0_amd64.deb
            /tmp/stonewild-server.log
            /tmp/stonewild-visual.log
          if-no-files-found: error
          retention-days: 14
