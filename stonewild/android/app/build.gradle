plugins {
    id "com.android.application"
}

android {
    namespace "game.stonewild.mobile"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "game.stonewild.mobile"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra -Wpedantic"
                arguments "-DANDROID_STL=c++_static"
                targets "stonewild"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
