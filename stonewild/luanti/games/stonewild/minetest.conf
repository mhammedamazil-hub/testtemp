# Stonewild Realms visual profile
# Balanced for modern Android devices and 4 GB Linux Mint laptops.
name = Wanderer
creative_mode = false
enable_damage = true
fixed_map_seed =
time_speed = 48

# Renderer and atmosphere
enable_post_processing = true
enable_dynamic_shadows = true
shadow_map_texture_size = 1024
shadow_map_max_distance = 80
shadow_map_color = true
shadow_filters = 1
shadow_poisson_filter = true
shadow_update_frames = 8
enable_bloom = true
enable_auto_exposure = true
enable_volumetric_lighting = true
tone_mapping = true
enable_waving_leaves = true
enable_waving_plants = true
enable_waving_water = true
water_wave_height = 0.55
water_wave_length = 14
water_wave_speed = 3.4
leaves_style = fancy
connected_glass = true
enable_translucent_foliage = true
enable_water_reflections = true

# Clean edges and detailed materials
antialiasing = none
fxaa = true
mip_map = true
anisotropic_filter = true
bilinear_filter = true
trilinear_filter = false
texture_min_size = 192

# Mobile-conscious draw distance and frame pacing
viewing_range = 110
max_block_send_distance = 10
max_block_generate_distance = 8
fps_max = 60
fps_max_unfocused = 20
cloud_radius = 10
translucent_liquids = true

# Standalone game behavior
menu_last_game = stonewild
maintab_LAST = local_game
enable_server = false
enable_client_modding = false
curl_verify_cert = true
server_announce = false
